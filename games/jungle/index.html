<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jungle · Mead Bros Games</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #a9c9b4; font-family: system-ui, sans-serif; }
      #app, #app canvas { display: block; width: 100%; height: 100%; }
      .back {
        position: fixed; top: 12px; left: 12px; z-index: 3; color: #fff; text-decoration: none;
        font-size: 14px; padding: 6px 10px; border-radius: 6px; background: rgba(0, 0, 0, 0.35);
      }
      .back:hover { background: rgba(0, 0, 0, 0.55); }
      #hud {
        position: fixed; bottom: 12px; left: 12px; z-index: 2; color: #fff; font-size: 13px;
        padding: 6px 10px; border-radius: 6px; background: rgba(0, 0, 0, 0.35);
      }
      #crosshair {
        position: fixed; top: 50%; left: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
        border-radius: 50%; background: rgba(255, 255, 255, 0.8); z-index: 2; pointer-events: none;
      }
      #overlay {
        position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; cursor: pointer;
        background: rgba(10, 25, 15, 0.55); color: #fff; text-align: center;
      }
      #overlay[hidden] { display: none; }
      #overlay h1 { margin: 0 0 8px; font-size: 2.5rem; color: #f4c542; }
      #overlay p { margin: 4px 0; opacity: 0.9; }
      #overlay .start { margin-top: 20px; font-weight: 600; font-size: 1.1rem; }
      kbd {
        display: inline-block; min-width: 1.4em; padding: 1px 6px; border-radius: 4px;
        background: rgba(255, 255, 255, 0.15); font-family: inherit; font-size: 0.85em;
      }
      body.swimming #crosshair { background: rgba(160, 230, 255, 0.9); }
    </style>
  </head>
  <body>
    <a class="back" href="../../">← All games</a>
    <div id="app"></div>
    <div id="crosshair"></div>
    <div id="hud">World <span id="seed"></span> · <kbd>N</kbd> new world</div>
    <div id="overlay">
      <div>
        <h1>Jungle</h1>
        <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · <kbd>Mouse</kbd> look · <kbd>Shift</kbd> run · <kbd>Space</kbd> jump / swim up</p>
        <p><kbd>Esc</kbd> to pause</p>
        <p class="start">Click to explore</p>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
