<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Three Brothers of Yorkshire · Mead Bros Games</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b09; }
      body { display: grid; place-items: center; font-family: system-ui, sans-serif; }
      canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      .back {
        position: fixed; top: 12px; left: 12px; z-index: 2; color: #ccc; text-decoration: none;
        font-size: 14px; padding: 6px 10px; border-radius: 6px; background: rgba(0, 0, 0, 0.45);
      }
      .back:hover { color: #fff; background: rgba(0, 0, 0, 0.65); }
      .rotate {
        display: none; position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
        color: #f3ead8; background: rgba(0, 0, 0, 0.6); padding: 8px 14px; border-radius: 8px; font-size: 14px;
      }
      @media (orientation: portrait) and (max-width: 700px) { .rotate { display: block; } }
    </style>
  </head>
  <body>
    <a class="back" href="../../">← All games</a>
    <canvas id="game"></canvas>
    <div class="rotate">Turn your phone sideways for a bigger picture</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
